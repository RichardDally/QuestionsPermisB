<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entraînement Permis B</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div id="app" class="app-container">
        <!-- Setup Screen -->
        <div id="setup-screen" class="screen active">
            <div class="glass-card">
                <h1>Questions Permis B</h1>
                <p>Préparez-vous pour l'examen officiel.</p>
                
                <div class="input-group">
                    <label for="question-count">Combien de questions voulez-vous ?</label>
                    <input type="number" id="question-count" min="1" max="100" value="10">
                </div>
                
                <button id="start-btn" class="primary-btn">Commencer l'entraînement</button>
            </div>
        </div>

        <!-- Chat Screen -->
        <div id="chat-screen" class="screen">
            <div class="chat-header">
                <h2>Question <span id="current-q-num">1</span> / <span id="total-q-num">10</span></h2>
                <div class="score-display">Score: <span id="current-score">0</span></div>
            </div>
            
            <div class="chat-container" id="chat-messages">
                <!-- Messages will be injected here -->
            </div>
            
            <div class="chat-input-area" id="input-area">
                <input type="text" id="user-answer" placeholder="Tapez votre réponse ici..." autocomplete="off">
                <button id="send-btn" class="send-btn">
                    <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" class="css-i6dzq1"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
                </button>
            </div>
            
            <div class="evaluation-area hidden" id="evaluation-area">
                <p>Avez-vous répondu correctement ?</p>
                <div class="eval-buttons">
                    <button id="eval-yes" class="success-btn">Oui, 1 point</button>
                    <button id="eval-no" class="danger-btn">Non, 0 point</button>
                </div>
            </div>
        </div>

        <!-- Result Screen -->
        <div id="result-screen" class="screen">
            <div class="glass-card result-card">
                <h1>Résultat Final</h1>
                <div class="final-score" id="final-score-display">8/10</div>
                <p id="result-message">Excellent travail !</p>
                <button id="restart-btn" class="primary-btn">Recommencer</button>
            </div>
        </div>
    </div>

    <script src="/static/app.js?v=2"></script>
</body>
</html>
